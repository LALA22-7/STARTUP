services:
  postgres_db:
    image: postgres:15-alpine
    container_name: clinic_database
    restart: always
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: clinic_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_admin -d clinic_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_app
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic_admin:securepassword123@postgres_db:5432/clinic_booking
      GOOGLE_CREDENTIALS_FILE: /backend/google_credentials.json
    ports:
      - "8000:8000"
    volumes:
      - ./google_credentials.json:/backend/google_credentials.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: