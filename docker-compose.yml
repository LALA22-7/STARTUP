version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: clinic_database
    restart: always
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: clinic_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: